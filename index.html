<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050812" />
  <title>Altea — Globus</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { margin:0; width:100%; height:100%; overflow:hidden; background:#050812; font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    #app { position:fixed; inset:0; }
    canvas { display:block; width:100%; height:100%; touch-action:none; }
    .hud { position:fixed; inset:0; pointer-events:none; }
    .brand { position:absolute; left:20px; top:18px; padding:10px 14px; border-radius:14px; background:rgba(3,8,20,.55); border:1px solid rgba(255,255,255,.12); backdrop-filter:blur(10px); box-shadow:0 10px 35px rgba(0,0,0,.25); }
    .brand h1 { margin:0; font-size:20px; letter-spacing:.18em; font-weight:800; }
    .brand p { margin:4px 0 0; font-size:12px; color:rgba(255,255,255,.68); }
    .top-right { pointer-events:auto; position:absolute; right:18px; top:18px; display:flex; flex-direction:column; align-items:flex-end; gap:8px; max-width:min(900px,calc(100vw - 36px)); }
    .controls,.layers { display:flex; gap:8px; flex-wrap:wrap; justify-content:flex-end; }
    .layers { padding:6px; border-radius:14px; background:rgba(3,8,20,.48); border:1px solid rgba(255,255,255,.10); backdrop-filter:blur(10px); }
    button { appearance:none; border:1px solid rgba(255,255,255,.14); background:rgba(3,8,20,.62); color:white; padding:9px 12px; border-radius:12px; cursor:pointer; backdrop-filter:blur(10px); font-weight:650; transition:background .15s ease,border-color .15s ease,transform .15s ease; }
    button:hover { background:rgba(16,27,48,.86); }
    button:active { transform:translateY(1px); }
    .layer-btn.active { background:rgba(80,135,220,.88); border-color:rgba(166,205,255,.75); box-shadow:0 0 0 1px rgba(166,205,255,.10) inset; }
    .hint { position:absolute; left:50%; bottom:18px; transform:translateX(-50%); padding:8px 12px; border-radius:999px; background:rgba(3,8,20,.5); border:1px solid rgba(255,255,255,.1); color:rgba(255,255,255,.72); font-size:12px; white-space:nowrap; backdrop-filter:blur(10px); transition:opacity .4s ease; }
    .coords { position:absolute; left:18px; bottom:18px; padding:7px 10px; border-radius:10px; background:rgba(3,8,20,.5); border:1px solid rgba(255,255,255,.1); color:rgba(255,255,255,.62); font-size:11px; opacity:0; transition:opacity .2s; }
    .coords.show { opacity:1; }
    #error { display:none; position:fixed; left:18px; right:18px; bottom:18px; z-index:20; background:#4b1515; border:1px solid #a84b4b; padding:12px 14px; border-radius:12px; }
    @media (max-width:800px) {
      .brand { left:12px; top:12px; }
      .top-right { right:12px; top:82px; max-width:calc(100vw - 24px); }
      .layers,.controls { max-width:100%; }
      button { padding:8px 10px; font-size:12px; }
      .hint { bottom:12px; font-size:11px; }
      .coords { display:none; }
    }
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>
</head>
<body>
  <div id="app"></div>
  <div class="hud">
    <div class="brand"><h1>ALTEA</h1><p>interaktywny globus świata</p></div>
    <div class="top-right">
      <div class="controls">
        <button id="spinBtn">⏸ Zatrzymaj obrót</button>
        <button id="resetBtn">↺ Ustaw widok</button>
        <button id="fullBtn">⛶ Pełny ekran</button>
      </div>
      <div class="layers" aria-label="Poziom szczegółowości mapy">
        <button class="layer-btn active" data-layer="miasta">Miasta</button>
        <button class="layer-btn" data-layer="stany">Stany i Wyspy</button>
        <button class="layer-btn" data-layer="dystrykty">Dystrykty</button>
        <button class="layer-btn" data-layer="kontynenty">Kontynenty</button>
      </div>
    </div>
    <div id="hint" class="hint">Przeciągnij, aby obracać • kółko / szczypanie = zoom</div>
    <div id="coords" class="coords"></div>
  </div>
  <div id="error"></div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const MAPS = {
      miasta: './altea_miasta.png',
      stany: './altea_stany_wyspy.png',
      dystrykty: './altea_dystrykty.png',
      kontynenty: './altea_kontynenty.png'
    };

    const container = document.getElementById('app');
    const renderer = new THREE.WebGLRenderer({ antialias:true, alpha:false, powerPreference:'high-performance' });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    container.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x050812);

    const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.05, 100);
    camera.position.set(0, 0.08, 3.15);

    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.055;
    controls.enablePan = false;
    controls.minDistance = 1.45;
    controls.maxDistance = 6.0;
    controls.rotateSpeed = 0.58;
    controls.zoomSpeed = 0.8;

    const DEFAULT_ROT_Y = Math.PI * 1.94;
    const DEFAULT_ROT_X = -0.04;

    const world = new THREE.Group();
    world.rotation.set(DEFAULT_ROT_X, DEFAULT_ROT_Y, 0);
    scene.add(world);

    const textureLoader = new THREE.TextureLoader();
    const textureCache = new Map();

    function configureTexture(texture) {
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.anisotropy = renderer.capabilities.getMaxAnisotropy();
      texture.minFilter = THREE.LinearMipmapLinearFilter;
      texture.magFilter = THREE.LinearFilter;
      texture.generateMipmaps = true;
      return texture;
    }

    async function loadTexture(path) {
      if (textureCache.has(path)) return textureCache.get(path);
      const texture = await textureLoader.loadAsync(path);
      configureTexture(texture);
      textureCache.set(path, texture);
      return texture;
    }

    const startTexture = await loadTexture(MAPS.miasta);
    const globeMaterial = new THREE.MeshStandardMaterial({ map:startTexture, roughness:0.9, metalness:0.0 });
    const globe = new THREE.Mesh(new THREE.SphereGeometry(1,256,160), globeMaterial);
    world.add(globe);

    const atmosphere = new THREE.Mesh(
      new THREE.SphereGeometry(1.018,128,96),
      new THREE.MeshBasicMaterial({ color:0x8fdcff, transparent:true, opacity:0.075, side:THREE.BackSide, blending:THREE.AdditiveBlending, depthWrite:false })
    );
    world.add(atmosphere);

    const starGeo = new THREE.BufferGeometry();
    const stars = [];
    for (let i=0;i<1800;i++) {
      const r=15+Math.random()*35, u=Math.random(), v=Math.random();
      const theta=2*Math.PI*u, phi=Math.acos(2*v-1);
      stars.push(r*Math.sin(phi)*Math.cos(theta), r*Math.cos(phi), r*Math.sin(phi)*Math.sin(theta));
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(stars,3));
    scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color:0xffffff, size:0.035, sizeAttenuation:true, transparent:true, opacity:0.78 })));

    scene.add(new THREE.AmbientLight(0xffffff,0.72));
    scene.add(new THREE.HemisphereLight(0xcfe5ff,0x26324a,1.1));

    const keyLight = new THREE.DirectionalLight(0xffffff,1.55);
    keyLight.target.position.set(0,0,0);
    scene.add(keyLight);
    scene.add(keyLight.target);

    const rim = new THREE.DirectionalLight(0x75aaff,0.28);
    rim.position.set(-4,2,-4);
    scene.add(rim);

    let autoSpin = true;
    let interacting = false;
    let activeLayer = 'miasta';
    controls.addEventListener('start',()=>interacting=true);
    controls.addEventListener('end',()=>interacting=false);

    const spinBtn = document.getElementById('spinBtn');
    spinBtn.onclick = () => {
      autoSpin = !autoSpin;
      spinBtn.textContent = autoSpin ? '⏸ Zatrzymaj obrót' : '▶ Włącz obrót';
    };

    document.getElementById('resetBtn').onclick = () => {
      camera.position.set(0,0.08,3.15);
      controls.target.set(0,0,0);
      world.rotation.set(DEFAULT_ROT_X,DEFAULT_ROT_Y,0);
      controls.update();
    };

    document.getElementById('fullBtn').onclick = async () => {
      try {
        if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
        else await document.exitFullscreen();
      } catch(e) {}
    };

    const errorEl = document.getElementById('error');
    document.querySelectorAll('.layer-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const layer = btn.dataset.layer;
        if (!layer || layer === activeLayer) return;
        try {
          const texture = await loadTexture(MAPS[layer]);
          globeMaterial.map = texture;
          globeMaterial.needsUpdate = true;
          activeLayer = layer;
          document.querySelectorAll('.layer-btn').forEach(x => x.classList.toggle('active', x === btn));
          errorEl.style.display = 'none';
        } catch(err) {
          errorEl.style.display = 'block';
          errorEl.textContent = `Nie udało się wczytać mapy: ${MAPS[layer]}`;
        }
      });
    });

    setTimeout(() => {
      Object.entries(MAPS).forEach(([key,path]) => {
        if (key !== 'miasta') loadTexture(path).catch(()=>{});
      });
    }, 900);

    const raycaster = new THREE.Raycaster();
    const pointer = new THREE.Vector2();
    const coordsEl = document.getElementById('coords');
    renderer.domElement.addEventListener('pointerdown', ev => {
      if (!ev.shiftKey) return;
      const r = renderer.domElement.getBoundingClientRect();
      pointer.x = ((ev.clientX-r.left)/r.width)*2-1;
      pointer.y = -((ev.clientY-r.top)/r.height)*2+1;
      raycaster.setFromCamera(pointer,camera);
      const hit = raycaster.intersectObject(globe,false)[0];
      if (!hit?.uv) return;
      const lon = (hit.uv.x*360-180).toFixed(2);
      const lat = (hit.uv.y*180-90).toFixed(2);
      coordsEl.textContent = `Mapa: lon ${lon}°, lat ${lat}°`;
      coordsEl.classList.add('show');
      clearTimeout(coordsEl._t);
      coordsEl._t = setTimeout(()=>coordsEl.classList.remove('show'),4500);
    });

    const hint = document.getElementById('hint');
    setTimeout(()=>hint.style.opacity='.25',7000);

    const clock = new THREE.Clock();
    function animate() {
      requestAnimationFrame(animate);
      const dt = Math.min(clock.getDelta(),0.05);
      if (autoSpin && !interacting) world.rotation.y += dt*0.055;
      keyLight.position.copy(camera.position);
      controls.update();
      renderer.render(scene,camera);
    }
    animate();

    addEventListener('resize', () => {
      camera.aspect = innerWidth/innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth,innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1,2));
    });
  </script>
</body>
</html>

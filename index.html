<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#050812"/>
<title>Altea — Globus</title>
<style>
:root{color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050812;font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
#app{position:fixed;inset:0}
canvas{display:block;width:100%;height:100%;touch-action:none}
.hud{position:fixed;inset:0;pointer-events:none}
.brand{position:absolute;left:20px;top:18px;padding:10px 14px;border-radius:14px;background:rgba(3,8,20,.55);border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px);box-shadow:0 10px 35px rgba(0,0,0,.25)}
.brand h1{margin:0;font-size:20px;letter-spacing:.18em;font-weight:800}
.brand p{margin:4px 0 0;font-size:12px;color:rgba(255,255,255,.68)}
.top-right{pointer-events:auto;position:absolute;right:18px;top:18px;display:flex;flex-direction:column;align-items:flex-end;gap:8px;max-width:min(900px,calc(100vw - 36px))}
.controls,.layers{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.layers{padding:6px;border-radius:14px;background:rgba(3,8,20,.48);border:1px solid rgba(255,255,255,.10);backdrop-filter:blur(10px)}
button{appearance:none;border:1px solid rgba(255,255,255,.14);background:rgba(3,8,20,.62);color:#fff;padding:9px 12px;border-radius:12px;cursor:pointer;backdrop-filter:blur(10px);font-weight:650;transition:.15s}
button:hover{background:rgba(16,27,48,.86)}
button:active{transform:translateY(1px)}
.layer-btn.active{background:rgba(80,135,220,.88);border-color:rgba(166,205,255,.75)}
.hint{position:absolute;left:50%;bottom:18px;transform:translateX(-50%);padding:8px 12px;border-radius:999px;background:rgba(3,8,20,.5);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.72);font-size:12px;white-space:nowrap;backdrop-filter:blur(10px);transition:opacity .4s}
.coords{position:absolute;left:18px;bottom:18px;padding:7px 10px;border-radius:10px;background:rgba(3,8,20,.5);border:1px solid rgba(255,255,255,.1);color:rgba(255,255,255,.62);font-size:11px;opacity:0;transition:opacity .2s}
.coords.show{opacity:1}
.tooltip{display:none;position:fixed;z-index:30;pointer-events:none;padding:6px 9px;border-radius:9px;background:rgba(2,7,17,.88);border:1px solid rgba(255,255,255,.15);font-size:12px;font-weight:700;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.info-panel{pointer-events:auto;position:fixed;right:18px;top:132px;width:min(390px,calc(100vw - 36px));max-height:calc(100vh - 155px);overflow:auto;z-index:25;padding:18px 18px 16px;border-radius:18px;background:rgba(3,8,20,.88);border:1px solid rgba(255,255,255,.13);backdrop-filter:blur(14px);box-shadow:0 18px 55px rgba(0,0,0,.4);transform:translateX(calc(100% + 40px));opacity:0;transition:transform .22s ease,opacity .22s ease}
.info-panel.open{transform:translateX(0);opacity:1}
.info-close{position:absolute;right:10px;top:10px;padding:5px 9px;font-size:15px;background:rgba(255,255,255,.07)}
.info-kicker{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#8fbaff;font-weight:800;margin-bottom:5px}
.info-panel h2{margin:0 40px 12px 0;font-size:25px}
.info-row{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:7px 0;border-top:1px solid rgba(255,255,255,.08);font-size:13px}
.info-row .label{color:rgba(255,255,255,.55)}
.info-section{border-top:1px solid rgba(255,255,255,.08);padding-top:12px;margin-top:7px}
.info-section h3{margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:.09em;color:rgba(255,255,255,.55)}
.info-section p{margin:0;line-height:1.55;font-size:14px;color:rgba(255,255,255,.9)}
.click-mode{position:absolute;left:20px;top:92px;padding:7px 10px;border-radius:10px;background:rgba(3,8,20,.48);border:1px solid rgba(255,255,255,.1);font-size:11px;color:rgba(255,255,255,.67)}
#error{display:none;position:fixed;left:18px;right:18px;bottom:18px;z-index:40;background:#4b1515;border:1px solid #a84b4b;padding:12px 14px;border-radius:12px}
@media(max-width:800px){
.brand{left:12px;top:12px}.top-right{right:12px;top:82px;max-width:calc(100vw - 24px)}
button{padding:8px 10px;font-size:12px}.click-mode{display:none}.hint{bottom:12px;font-size:11px}.coords{display:none}
.info-panel{right:10px;left:10px;top:auto;bottom:10px;width:auto;max-height:52vh;transform:translateY(calc(100% + 30px))}
.info-panel.open{transform:translateY(0)}
}
</style>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"}}</script>
</head>
<body>
<div id="app"></div>
<div class="hud">
  <div class="brand"><h1>ALTEA</h1><p>interaktywny globus świata</p></div>
  <div id="clickMode" class="click-mode">Miasta: warstwa informacyjna bez klikalnych kart</div>
  <div class="top-right">
    <div class="controls">
      <button id="spinBtn">⏸ Zatrzymaj obrót</button>
      <button id="resetBtn">↺ Ustaw widok</button>
      <button id="fullBtn">⛶ Pełny ekran</button>
    </div>
    <div class="layers">
      <button class="layer-btn active" data-layer="miasta">Miasta</button>
      <button class="layer-btn" data-layer="stany">Stany i Wyspy</button>
      <button class="layer-btn" data-layer="dystrykty">Dystrykty</button>
      <button class="layer-btn" data-layer="kontynenty">Kontynenty</button>
    </div>
  </div>
  <div id="hint" class="hint">Przeciągnij, aby obracać • kółko / szczypanie = zoom</div>
  <div id="coords" class="coords"></div>
</div>

<div id="tooltip" class="tooltip"></div>
<aside id="infoPanel" class="info-panel">
  <button id="infoClose" class="info-close">✕</button>
  <div id="infoContent"></div>
</aside>
<div id="error"></div>

import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const DATA = {"continents": {"Kentria": {"type": "Kontynent", "opis": "Największy kontynent Altei. Ojczyzna Ludzi, Oni, Genasi, Elfów, Orków, Niziołków oraz niektórych klanów Goliathów i Skavran. Szeroki wachlarz klimatów, od gorących równin na południowym-zachodzie, przez klimat umiarkowany na północnym-zachodzie, zimne tundry na wschodnim wybrzeżu, po jałowe pustkowia na południu.", "stolica": "Stolica Altei Airoudan (zniszczona)", "wladca": "Lady Odiane z Pyrghos, Elfka", "info": "Obecnie większość kontynentu znajduje się pod władzą Karaisańską, trwa wojna."}, "Tifia": {"type": "Kontynent", "opis": "Jej mieszkańcy cenią kontakt z naturą. Ojczyzna Satyrów, Airi, Khajiit'ów i leśnych elfów. Klimat ciepły, tropikalny.", "stolica": "brak", "wladca": "Lord Igetis z Cherson, Skavran", "info": "brak"}, "Macrichor": {"type": "Kontynent", "opis": "Duża część tego kontynentu jest silnie skupiona na religii. Ojczyzna Loxodonów, niektórych klanów Goliathów i Orków oraz ludzkiej kolonii. Kontynent w dużej mierze pokryty mroźną tundrą.", "stolica": "brak", "wladca": "Lord Varys z Ekklis, Loxodon", "info": "Dom dla wielu typów istot nadprzyrodzonych (Wampirze Dwory, Stada Wilkołaków itd.)."}, "Ammodes": {"type": "Kontynent", "opis": "Pustynny kontynent. Ojczyzna Sauriali i Sarrukhów oraz niektórych klanów Khajiit'ów. Przez 3 tysiące lat stanowił dom dla Drakonów. Bardzo ciepły klimat.", "stolica": "brak", "wladca": "Lord Erpon z Kelyf, Saurial", "info": "Po Karaisańskiej inwazji spora część kontynentu została unicestwiona przez wybuch. Większość populacji Ammodesu zdążyła się ewakuować na inne kontynenty. Drakoni wyruszyli w podróż powrotną do swojej ojczyzny, na Drakorię."}, "Edafos": {"type": "Kontynent", "opis": "Lodowy kontynent, położony na pasie lodowców okrążających świat. Ojczyzna niektórych klanów Orków i Skavran oraz ludzkiej kolonii.", "stolica": "brak", "wladca": "Lady Sakkali z Thropos, Człowiek", "info": "brak"}, "Drakoria": {"type": "Kontynent", "opis": "Tajemniczy kontynent, niepodległy rządom Alteańczyków. Dom dla smoków i innych legendarnych istot.", "stolica": "brak", "wladca": "Vran, Król Smoków, Wielki Smok Burzy", "info": "Dawniej ojczyzna Drakonów, zniszczona przez wojnę z Wielkim Smokiem Chaosu. Po 3 tysiącach lat Drakoni powracają, by odbudować swoje królestwo."}}, "districts": {"Karaisan": {"type": "Dystrykt", "kontynent": "Kentria", "opis": "Północny dystrykt Kentrii. Ojczyzna Ergy, Cherbaty i Oni. Granice dystryktu wyznaczone są na bazie granicy dawnego Imperium Karaisańskiego. Swojego Barona nadal nazywają imperatorem.", "stolica": "Thoras", "info": "Kultura Karaisańska wzorowana jest na kulturze Japońskiej, Chińskiej i Koreańskiej. Karaisan jest rejonem skupionym na sile."}, "Kephal": {"type": "Dystrykt", "kontynent": "Kentria", "opis": "Największy Dystrykt, zamieszkały przez szeroki wachlarz ras. Znajdowała się tu stolica Altei, co przyczyniało się do znacznej imigracji Alteańczyków z różnych stron świata. Dawniej większość Kephalu znajdowała się pod władzą Genasi, pierwszej inteligentnej rasy Altei. Dziś jest ojczyzną Genasi, Elfów i niektórych klanów Skavran.", "stolica": "Airoudan (zniszczone)", "info": "Kephal znajduje się obecnie pod władzą Karaisanu."}, "Levra": {"type": "Dystrykt", "kontynent": "Kentria", "opis": "Wschodni dystrykt Kentrii. Ojczyzna Ludzi, Krasnoludów i Niziołków. Obszar głównie poświęcony rolnictwu, połowowi ryb i górnictwu.", "stolica": "brak", "info": "brak"}, "Notos": {"type": "Dystrykt", "kontynent": "Kentria", "opis": "Południowy dystrykt Kentrii. Surowe, jałowe pustkowia i skalne wzgórza. Ojczyzna Orków i niektórych klanów Goliathów.", "stolica": "brak", "info": "brak"}, "Mesan": {"type": "Dystrykt", "kontynent": "Tifia", "opis": "Północny dystrykt Tifii. Ojczyzna Airi i leśnych Elfów.", "stolica": "brak", "info": "brak"}, "Agrios": {"type": "Dystrykt", "kontynent": "Tifia", "opis": "Południowy dystrykt Tifii. Ojczyzna Skavran, Satyrów i Khajiit'ów.", "stolica": "brak", "info": "brak"}, "Stratos": {"type": "Dystrykt", "kontynent": "Macrichor", "opis": "Północny dystrykt Macrichor'u. Ojczyzna Loxodonów. Bardzo religijny region.", "stolica": "Ekklis", "info": "brak"}, "Genikos": {"type": "Dystrykt", "kontynent": "Macrichor", "opis": "Zachodni dystrykt Macrichor'u. Ojczyzna niektórych klanów Orków. Bardzo wojskowy region.", "stolica": "Frour", "info": "brak"}, "Sakhan": {"type": "Dystrykt", "kontynent": "Macrichor", "opis": "Wschodni dystrykt Macrichor'u. Ojczyzna niektórych klanów Goliathów i ludzkiej kolonii.", "stolica": "brak", "info": "To tutejsze klany Goliathów zapoczątkowały swoją własną kulturę, podobną do kultury staronordyckiej. Tę samą kulturę zaadaptowała następnie znajdująca się tam ludzka kolonia."}, "Kafti": {"type": "Dystrykt", "kontynent": "Ammodes", "opis": "Zachodni dystrykt Ammodesu. Ojczyzna Sauriali i Sarrukhów. Rejon silnie poświęcony technologii i magii.", "stolica": "brak", "info": "Opuszczony w związku z tragedią na Ammodesie."}, "Nerou": {"type": "Dystrykt", "kontynent": "Ammodes", "opis": "Wschodni dystrykt Ammodesu. Ojczyzna niektórych klanów Khajiit'ów i dom dla Drakonów.", "stolica": "brak", "info": "Połowa tego dystryktu została unicestwiona w wyniku eksplozji kataklizmu."}, "Pagos": {"type": "Dystrykt", "kontynent": "Edafos", "opis": "Północny dystrykt Edafos. Ojczyzna dla niektórych klanów Skavran i ludzkiej kolonii.", "stolica": "brak", "info": "Obecnie znajdują się tam uciekinierzy z Kentrii i Ammodesu, w tym Lady Odiane."}, "Anemos": {"type": "Dystrykt", "kontynent": "Edafos", "opis": "Południowy dystrykt Edafos. Ojczyzna niektórych klanów Orków.", "stolica": "Vasi", "info": "brak"}}, "states": {"Lofos": {"type": "Stan", "dystrykt": "Kephal", "kontynent": "Kentria", "opis": "Stan handlowy/portowy."}, "Dasos": {"type": "Stan", "dystrykt": "Kephal", "kontynent": "Kentria", "opis": "Stan skupiony na badaniu Magii. Magiczne lasy i Wielkie Drzewo Życia."}, "Vathra": {"type": "Stan", "dystrykt": "Kephal", "kontynent": "Kentria", "opis": "Stan centralny, tu znajdowało się Airoudan."}, "Livadia": {"type": "Stan", "dystrykt": "Kephal", "kontynent": "Kentria", "opis": "Siedziba Elfów."}, "Zounos": {"type": "Stan", "dystrykt": "Kephal", "kontynent": "Kentria", "opis": "Ojczyzna Genasi."}, "Sousi": {"type": "Stan", "dystrykt": "Karaisan", "kontynent": "Kentria", "opis": "Stan poświęcony sztuce. Odłam kultury wzorowany bardziej na kulturze Koreańskiej."}, "Nouka": {"type": "Stan", "dystrykt": "Karaisan", "kontynent": "Kentria", "opis": "Stan specjalizujący się w wyrobie broni i pancerzy."}, "Shoji": {"type": "Stan", "dystrykt": "Karaisan", "kontynent": "Kentria", "opis": "Stan handlowy."}, "Nihon": {"type": "Stan", "dystrykt": "Karaisan", "kontynent": "Kentria", "opis": "Główny stan Karaisanu, tu znajduje się dawna stolica Imperium — Thoras."}, "Vizon": {"type": "Stan", "dystrykt": "Levra", "kontynent": "Kentria", "opis": "Dawniej królestwo Niziołków. Stan rolniczy. Kultura wzorowana na francuskiej."}, "Polis": {"type": "Stan", "dystrykt": "Levra", "kontynent": "Kentria", "opis": "Dawniej królestwo ludzi. Stan połowowy, portowy, specjalizujący się w łodziach. Kultura wzorowana na brytyjskiej."}, "Duria": {"type": "Stan", "dystrykt": "Levra", "kontynent": "Kentria", "opis": "Dawniej królestwo Krasnoludów. Stan górniczy. Kultura wzorowana na niemieckiej."}, "Matom": {"type": "Stan", "dystrykt": "Notos", "kontynent": "Kentria", "opis": "Północne pustkowia, ojczyzna Orków."}, "Krizon": {"type": "Stan", "dystrykt": "Notos", "kontynent": "Kentria", "opis": "Południowe pustkowia, ojczyzna Orków."}, "Exoris": {"type": "Stan", "dystrykt": "Notos", "kontynent": "Kentria", "opis": "Skalne wzgórza, ojczyzna Goliathów."}, "Pigon": {"type": "Wyspa", "dystrykt": "Wyspa", "kontynent": "Kentria", "opis": "Wolna wyspa, zamieszkała przez kolonię Karaisańskich uciekinierów."}, "Tsanta": {"type": "Wyspa", "dystrykt": "Wyspa", "kontynent": "Kentria", "opis": "Wyspa u ujścia Morza Ryghana. Oficjalnie niezamieszkała."}, "Kanta": {"type": "Wyspa", "dystrykt": "Wyspa", "kontynent": "Kentria", "opis": "Siedziba Zakonu Światła."}, "Archipelag Nisides": {"type": "Archipelag", "dystrykt": "Karaisan", "kontynent": "Kentria", "opis": "Archipelag na wschodzie Kentrii. Oficjalnie podległy pod Karaisan."}, "Korak": {"type": "Stan", "dystrykt": "Mesan", "kontynent": "Tifia", "opis": "Dom leśnych Elfów."}, "Zounkal": {"type": "Stan", "dystrykt": "Mesan", "kontynent": "Tifia", "opis": "Ojczyzna Airi."}, "Gonia": {"type": "Stan", "dystrykt": "Agrios", "kontynent": "Tifia", "opis": "Ojczyzna Khajiit'ów."}, "Fysi": {"type": "Stan", "dystrykt": "Mesan", "kontynent": "Tifia", "opis": "Ojczyzna Satyrów i Skavran."}, "Thriskel": {"type": "Stan", "dystrykt": "Stratos", "kontynent": "Macrichor", "opis": "Ojczyzna Loxodonów, siedziba wielu religii."}, "Konos": {"type": "Stan", "dystrykt": "Stratos", "kontynent": "Macrichor", "opis": "Ojczyzna Loxodonów."}, "Diafor": {"type": "Stan", "dystrykt": "Genikos", "kontynent": "Macrichor", "opis": "Ojczyzna niektórych klanów Orków."}, "Polem": {"type": "Stan", "dystrykt": "Genikos", "kontynent": "Macrichor", "opis": "Ojczyzna niektórych klanów Orków."}, "Nytthus": {"type": "Stan", "dystrykt": "Sakhan", "kontynent": "Macrichor", "opis": "Dom ludzkiej kolonii."}, "Erimia": {"type": "Stan", "dystrykt": "Sakhan", "kontynent": "Macrichor", "opis": "Ojczyzna niektórych klanów Goliathów."}, "Erimos": {"type": "Wyspa", "dystrykt": "Wyspa", "kontynent": "Macrichor", "opis": "Oficjalnie niezamieszkała."}, "Krymmen": {"type": "Wyspa", "dystrykt": "Wyspa", "kontynent": "Macrichor", "opis": "Oficjalnie niezamieszkała."}, "Exoria": {"type": "Wyspa", "dystrykt": "Wyspa", "kontynent": "Macrichor", "opis": "Znajduje się na niej niewielkie miasto Goliathów, Apov. Jest również siedzibą Wampirzego Dworu Nocy."}, "Ilios": {"type": "Stan", "dystrykt": "Nerou", "kontynent": "Ammodes", "opis": "Dawniej ojczyzna Sarrukhów. Przez ostatnie 3 tysiące lat — dom Drakonów."}, "Aktin": {"type": "Stan", "dystrykt": "Nerou", "kontynent": "Ammodes", "opis": "Dom dla dużej społeczności pustynnych Khajiit'ów. Niemal całkowicie unicestwiony przez Karaisan."}, "Fotia": {"type": "Stan", "dystrykt": "Kafti", "kontynent": "Ammodes", "opis": "Ojczyzna Sauriali i światowa stolica technologii."}, "Moti": {"type": "Stan", "dystrykt": "Kafti", "kontynent": "Ammodes", "opis": "Ojczyzna Sarrukhów, znana z niewolnictwa w przeszłości."}, "Erpon": {"type": "Wyspa", "dystrykt": "Wyspa", "kontynent": "Ammodes", "opis": "Oficjalnie niezamieszkała."}, "Chion": {"type": "Stan", "dystrykt": "Pagos", "kontynent": "Edafos", "opis": "Ojczyzna niektórych klanów Skavran."}, "Thyel": {"type": "Stan", "dystrykt": "Pagos", "kontynent": "Edafos", "opis": "Dom ludzkiej kolonii."}, "Tern": {"type": "Stan", "dystrykt": "Anemos", "kontynent": "Edafos", "opis": "Ojczyzna niektórych klanów Orków."}, "Monos": {"type": "Stan", "dystrykt": "Anemos", "kontynent": "Edafos", "opis": "Ojczyzna niektórych klanów Orków."}, "Akro": {"type": "Wyspa", "dystrykt": "Wyspa", "kontynent": "Edafos", "opis": "Oficjalnie niezamieszkała."}}};
const HOTSPOTS = {"kontynenty": [["Macrichor", 335, 240, 115, 95], ["Tifia", 530, 295, 70, 85], ["Kentria", 825, 365, 145, 175], ["Ammodes", 548, 470, 85, 65], ["Edafos", 105, 470, 55, 80], ["Drakoria", 505, 748, 220, 105]], "dystrykty": [["Karaisan", 846, 302, 78, 68], ["Levra", 834, 355, 78, 54], ["Kephal", 748, 417, 68, 68], ["Notos", 850, 485, 78, 62], ["Mesan", 545, 274, 42, 42], ["Agrios", 522, 311, 48, 39], ["Stratos", 300, 184, 62, 37], ["Genikos", 294, 253, 55, 42], ["Sakhan", 385, 244, 52, 48], ["Kafti", 522, 447, 42, 40], ["Nerou", 595, 458, 37, 42], ["Pagos", 99, 452, 34, 42], ["Anemos", 101, 492, 36, 40]], "stany": [["Lofos", 699, 280, 36, 24], ["Dasos", 744, 292, 28, 25], ["Vathra", 766, 346, 34, 33], ["Livadia", 768, 423, 36, 34], ["Zounos", 727, 422, 34, 34], ["Sousi", 768, 277, 33, 27], ["Nouka", 800, 300, 34, 27], ["Shoji", 870, 299, 34, 28], ["Nihon", 861, 235, 46, 38], ["Vizon", 811, 360, 34, 27], ["Polis", 864, 357, 35, 27], ["Duria", 834, 408, 37, 29], ["Matom", 846, 455, 46, 38], ["Krizon", 857, 503, 43, 29], ["Exoris", 803, 520, 40, 28], ["Pigon", 703, 232, 25, 20], ["Tsanta", 681, 365, 22, 18], ["Kanta", 725, 505, 27, 20], ["Archipelag Nisides", 931, 383, 43, 39], ["Korak", 541, 239, 31, 28], ["Zounkal", 546, 278, 36, 27], ["Gonia", 507, 294, 32, 28], ["Fysi", 547, 309, 32, 26], ["Thriskel", 330, 181, 42, 28], ["Konos", 280, 181, 39, 29], ["Diafor", 288, 239, 38, 29], ["Polem", 311, 283, 39, 28], ["Nytthus", 359, 218, 39, 31], ["Erimia", 351, 267, 39, 31], ["Erimos", 255, 296, 25, 20], ["Krymmen", 398, 310, 32, 22], ["Exoria", 418, 197, 23, 20], ["Ilios", 594, 460, 29, 27], ["Aktin", 551, 430, 29, 26], ["Fotia", 516, 449, 28, 28], ["Moti", 527, 500, 27, 23], ["Erpon", 580, 426, 23, 20], ["Chion", 102, 423, 28, 24], ["Thyel", 77, 447, 23, 27], ["Tern", 95, 496, 28, 27], ["Monos", 128, 526, 30, 23], ["Akro", 64, 536, 22, 19]]};
const MAP_W = 2048, MAP_H = 1024;
const MAPS = {
  miasta:'./altea_miasta.png',
  stany:'./altea_stany_wyspy.png',
  dystrykty:'./altea_dystrykty.png',
  kontynenty:'./altea_kontynenty.png'
};

const container=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:false,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x050812);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.05,100);
camera.position.set(0,.08,3.15);

const controls=new OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=.055; controls.enablePan=false;
controls.minDistance=1.45; controls.maxDistance=6; controls.rotateSpeed=.58; controls.zoomSpeed=.8;

const DEFAULT_ROT_Y=Math.PI*1.94, DEFAULT_ROT_X=-.04;
const world=new THREE.Group();
world.rotation.set(DEFAULT_ROT_X,DEFAULT_ROT_Y,0);
scene.add(world);

const loader=new THREE.TextureLoader(), cache=new Map();
function configTexture(t){
  t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=renderer.capabilities.getMaxAnisotropy();
  t.minFilter=THREE.LinearMipmapLinearFilter;
  t.magFilter=THREE.LinearFilter;
  t.generateMipmaps=true;
  return t;
}
async function getTexture(path){
  if(cache.has(path)) return cache.get(path);
  const t=configTexture(await loader.loadAsync(path));
  cache.set(path,t); return t;
}

const material=new THREE.MeshStandardMaterial({map:await getTexture(MAPS.miasta),roughness:.9,metalness:0});
const globe=new THREE.Mesh(new THREE.SphereGeometry(1,256,160),material);
world.add(globe);

const atmosphere=new THREE.Mesh(
  new THREE.SphereGeometry(1.018,128,96),
  new THREE.MeshBasicMaterial({color:0x8fdcff,transparent:true,opacity:.075,side:THREE.BackSide,blending:THREE.AdditiveBlending,depthWrite:false})
);
world.add(atmosphere);

const starGeo=new THREE.BufferGeometry(), stars=[];
for(let i=0;i<1800;i++){const r=15+Math.random()*35,u=Math.random(),v=Math.random(),theta=2*Math.PI*u,phi=Math.acos(2*v-1);stars.push(r*Math.sin(phi)*Math.cos(theta),r*Math.cos(phi),r*Math.sin(phi)*Math.sin(theta))}
starGeo.setAttribute('position',new THREE.Float32BufferAttribute(stars,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xffffff,size:.035,sizeAttenuation:true,transparent:true,opacity:.78})));

scene.add(new THREE.AmbientLight(0xffffff,.72));
scene.add(new THREE.HemisphereLight(0xcfe5ff,0x26324a,1.1));
const keyLight=new THREE.DirectionalLight(0xffffff,1.55); keyLight.target.position.set(0,0,0); scene.add(keyLight,keyLight.target);
const rim=new THREE.DirectionalLight(0x75aaff,.28); rim.position.set(-4,2,-4); scene.add(rim);

let activeLayer='miasta', autoSpin=true, interacting=false, pointerDown=null, hovered=null;
controls.addEventListener('start',()=>interacting=true);
controls.addEventListener('end',()=>interacting=false);

const spinBtn=document.getElementById('spinBtn');
spinBtn.onclick=()=>{autoSpin=!autoSpin;spinBtn.textContent=autoSpin?'⏸ Zatrzymaj obrót':'▶ Włącz obrót'};
document.getElementById('resetBtn').onclick=()=>{camera.position.set(0,.08,3.15);controls.target.set(0,0,0);world.rotation.set(DEFAULT_ROT_X,DEFAULT_ROT_Y,0);controls.update()};
document.getElementById('fullBtn').onclick=async()=>{try{if(!document.fullscreenElement)await document.documentElement.requestFullscreen();else await document.exitFullscreen()}catch(e){}};

const panel=document.getElementById('infoPanel'),content=document.getElementById('infoContent');
document.getElementById('infoClose').onclick=()=>panel.classList.remove('open');
const tooltip=document.getElementById('tooltip'),clickMode=document.getElementById('clickMode');

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function row(label,value){if(!value||value==='brak')return '';return `<div class="info-row"><div class="label">${esc(label)}</div><div>${esc(value)}</div></div>`}
function section(label,value){if(!value||value==='brak')return '';return `<div class="info-section"><h3>${esc(label)}</h3><p>${esc(value)}</p></div>`}

function showInfo(name){
  let d=null;
  if(activeLayer==='kontynenty')d=DATA.continents[name];
  else if(activeLayer==='dystrykty')d=DATA.districts[name];
  else if(activeLayer==='stany')d=DATA.states[name];
  if(!d)return;

  let html=`<div class="info-kicker">${esc(d.type)}</div><h2>${esc(name)}</h2>`;
  if(activeLayer==='kontynenty'){
    html+=row('Stolica',d.stolica)+row('Władca',d.wladca)+section('Opis',d.opis)+section('Dodatkowe informacje',d.info);
  }else if(activeLayer==='dystrykty'){
    html+=row('Kontynent',d.kontynent)+row('Stolica',d.stolica)+section('Opis',d.opis)+section('Dodatkowe informacje',d.info);
  }else{
    html+=row('Kontynent',d.kontynent);
    if(d.dystrykt==='Wyspa') html+=row('Status','Niezależna wyspa');
    else html+=row('Dystrykt',d.dystrykt);
    html+=section('Opis',d.opis);
  }
  content.innerHTML=html;
  panel.classList.add('open');
}

const raycaster=new THREE.Raycaster(), pointer=new THREE.Vector2();
function uvFromEvent(ev){
  const r=renderer.domElement.getBoundingClientRect();
  pointer.x=((ev.clientX-r.left)/r.width)*2-1;
  pointer.y=-((ev.clientY-r.top)/r.height)*2+1;
  raycaster.setFromCamera(pointer,camera);
  const hit=raycaster.intersectObject(globe,false)[0];
  return hit?.uv||null;
}
function findHotspot(uv){
  if(!uv || activeLayer==='miasta')return null;
  const arr=HOTSPOTS[activeLayer]||[];
  const px=uv.x*MAP_W, py=uv.y*MAP_H;
  let best=null,bestD=Infinity;
  for(const h of arr){
    const [name,cx,cy,rx,ry]=h;
    const dx=(px-cx)/rx,dy=(py-cy)/ry,d=dx*dx+dy*dy;
    if(d<=1 && d<bestD){best={name,d};bestD=d}
  }
  return best;
}

renderer.domElement.addEventListener('pointerdown',ev=>{pointerDown={x:ev.clientX,y:ev.clientY}});
renderer.domElement.addEventListener('pointerup',ev=>{
  if(!pointerDown)return;
  const moved=Math.hypot(ev.clientX-pointerDown.x,ev.clientY-pointerDown.y);
  pointerDown=null;
  if(moved>7)return;
  if(ev.shiftKey)return;
  const h=findHotspot(uvFromEvent(ev));
  if(h)showInfo(h.name);
});

renderer.domElement.addEventListener('pointermove',ev=>{
  if(activeLayer==='miasta'){renderer.domElement.style.cursor=interacting?'grabbing':'grab';tooltip.style.display='none';return}
  const h=findHotspot(uvFromEvent(ev));
  hovered=h;
  if(h){
    renderer.domElement.style.cursor='pointer';
    tooltip.textContent=h.name;
    tooltip.style.display='block';
    tooltip.style.left=(ev.clientX+14)+'px';
    tooltip.style.top=(ev.clientY+14)+'px';
  }else{
    renderer.domElement.style.cursor=interacting?'grabbing':'grab';
    tooltip.style.display='none';
  }
});
renderer.domElement.addEventListener('pointerleave',()=>{tooltip.style.display='none'});

document.querySelectorAll('.layer-btn').forEach(btn=>{
  btn.addEventListener('click',async()=>{
    const layer=btn.dataset.layer;
    if(!layer||layer===activeLayer)return;
    try{
      material.map=await getTexture(MAPS[layer]);material.needsUpdate=true;activeLayer=layer;
      document.querySelectorAll('.layer-btn').forEach(x=>x.classList.toggle('active',x===btn));
      panel.classList.remove('open');tooltip.style.display='none';
      clickMode.textContent=layer==='miasta'?'Miasta: warstwa informacyjna bez klikalnych kart':
        layer==='stany'?'Kliknij stan lub wyspę, aby otworzyć informacje':
        layer==='dystrykty'?'Kliknij dystrykt, aby otworzyć informacje':
        'Kliknij kontynent, aby otworzyć informacje';
      document.getElementById('error').style.display='none';
    }catch(e){
      const er=document.getElementById('error');er.style.display='block';er.textContent=`Nie udało się wczytać mapy: ${MAPS[layer]}`;
    }
  });
});

setTimeout(()=>Object.values(MAPS).forEach(p=>getTexture(p).catch(()=>{})),800);

// Shift+klik: techniczne współrzędne do przyszłych szlaków, znaczników i wyszukiwarki.
const coordsEl=document.getElementById('coords');
renderer.domElement.addEventListener('click',ev=>{
  if(!ev.shiftKey)return;
  const uv=uvFromEvent(ev); if(!uv)return;
  const lon=(uv.x*360-180).toFixed(2),lat=(uv.y*180-90).toFixed(2);
  coordsEl.textContent=`Mapa: lon ${lon}°, lat ${lat}°`;
  coordsEl.classList.add('show');clearTimeout(coordsEl._t);
  coordsEl._t=setTimeout(()=>coordsEl.classList.remove('show'),4500);
});

const hint=document.getElementById('hint');
setTimeout(()=>hint.style.opacity='.25',7000);

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  if(autoSpin&&!interacting)world.rotation.y+=dt*.055;
  keyLight.position.copy(camera.position);
  controls.update();renderer.render(scene,camera);
}
animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
});
</script>
</body>
</html>

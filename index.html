<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="theme-color" content="#050812"/>
<title>Altea — Globus</title>

<style>
:root { color-scheme: dark; }
* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
  background: #050812;
  font-family: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
}

#app { position: fixed; inset: 0; }
canvas { display: block; width: 100%; height: 100%; touch-action: none; }

.hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
}

.brand {
  position: absolute;
  left: 20px;
  top: 18px;
  padding: 10px 14px;
  border-radius: 14px;
  background: rgba(3,8,20,.55);
  border: 1px solid rgba(255,255,255,.12);
  backdrop-filter: blur(10px);
  box-shadow: 0 10px 35px rgba(0,0,0,.25);
}

.brand h1 {
  margin: 0;
  font-size: 20px;
  letter-spacing: .18em;
  font-weight: 800;
}

.brand p {
  margin: 4px 0 0;
  font-size: 12px;
  color: rgba(255,255,255,.68);
}

.top-right {
  pointer-events: auto;
  position: absolute;
  right: 18px;
  top: 18px;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
  max-width: min(900px, calc(100vw - 36px));
}

.controls, .layers {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  justify-content: flex-end;
}

.layers {
  padding: 6px;
  border-radius: 14px;
  background: rgba(3,8,20,.48);
  border: 1px solid rgba(255,255,255,.10);
  backdrop-filter: blur(10px);
}

button {
  appearance: none;
  border: 1px solid rgba(255,255,255,.14);
  background: rgba(3,8,20,.62);
  color: white;
  padding: 9px 12px;
  border-radius: 12px;
  cursor: pointer;
  backdrop-filter: blur(10px);
  font-weight: 650;
  transition: background .15s ease, border-color .15s ease, transform .15s ease;
}

button:hover { background: rgba(16,27,48,.86); }
button:active { transform: translateY(1px); }

.layer-btn.active {
  background: rgba(80,135,220,.88);
  border-color: rgba(166,205,255,.75);
}

.atlas-toggle {
  pointer-events: auto;
  position: absolute;
  left: 20px;
  top: 92px;
  display: flex;
  align-items: center;
  gap: 7px;
  background: rgba(3,8,20,.72);
}

.hint {
  position: absolute;
  left: 50%;
  bottom: 18px;
  transform: translateX(-50%);
  padding: 8px 12px;
  border-radius: 999px;
  background: rgba(3,8,20,.50);
  border: 1px solid rgba(255,255,255,.10);
  color: rgba(255,255,255,.72);
  font-size: 12px;
  white-space: nowrap;
  backdrop-filter: blur(10px);
  transition: opacity .4s ease;
}

.coords {
  position: absolute;
  left: 18px;
  bottom: 18px;
  padding: 7px 10px;
  border-radius: 10px;
  background: rgba(3,8,20,.50);
  border: 1px solid rgba(255,255,255,.10);
  color: rgba(255,255,255,.62);
  font-size: 11px;
  opacity: 0;
  transition: opacity .2s;
}

.coords.show { opacity: 1; }

.atlas {
  pointer-events: auto;
  position: fixed;
  left: 14px;
  top: 140px;
  bottom: 14px;
  width: min(390px, calc(100vw - 28px));
  z-index: 30;
  display: flex;
  flex-direction: column;
  border-radius: 18px;
  background: rgba(3,8,20,.91);
  border: 1px solid rgba(255,255,255,.13);
  backdrop-filter: blur(16px);
  box-shadow: 0 18px 55px rgba(0,0,0,.42);
  transform: translateX(calc(-100% - 34px));
  opacity: 0;
  transition: transform .22s ease, opacity .22s ease;
  overflow: hidden;
}

.atlas.open {
  transform: translateX(0);
  opacity: 1;
}

.atlas-head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 16px 16px 12px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.atlas-title {
  font-size: 17px;
  font-weight: 800;
  letter-spacing: .03em;
}

.atlas-sub {
  font-size: 11px;
  color: rgba(255,255,255,.52);
  margin-top: 2px;
}

.atlas-close {
  padding: 5px 9px;
  font-size: 15px;
  background: rgba(255,255,255,.06);
}

.search-wrap {
  padding: 12px 14px;
  border-bottom: 1px solid rgba(255,255,255,.08);
}

.search {
  width: 100%;
  padding: 10px 12px;
  border-radius: 11px;
  border: 1px solid rgba(255,255,255,.13);
  outline: none;
  background: rgba(255,255,255,.055);
  color: white;
  font: inherit;
}

.search:focus {
  border-color: rgba(134,183,255,.8);
  box-shadow: 0 0 0 3px rgba(83,140,220,.12);
}

.search::placeholder { color: rgba(255,255,255,.38); }

.atlas-body {
  overflow: auto;
  padding: 10px;
}

.group {
  margin-bottom: 8px;
  border: 1px solid rgba(255,255,255,.08);
  border-radius: 13px;
  overflow: hidden;
  background: rgba(255,255,255,.025);
}

.group-head {
  width: 100%;
  border: 0;
  border-radius: 0;
  background: transparent;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 11px 12px;
}

.group-head:hover { background: rgba(255,255,255,.05); }

.group-meta {
  display: flex;
  align-items: center;
  gap: 8px;
}

.count {
  min-width: 24px;
  text-align: center;
  padding: 2px 7px;
  border-radius: 999px;
  background: rgba(255,255,255,.08);
  color: rgba(255,255,255,.62);
  font-size: 11px;
}

.chevron {
  color: rgba(255,255,255,.55);
  transition: transform .16s ease;
}

.group.open .chevron { transform: rotate(90deg); }

.group-items { display: none; padding: 0 7px 8px; }
.group.open .group-items { display: block; }

.item {
  width: 100%;
  text-align: left;
  display: block;
  border: 0;
  border-radius: 9px;
  padding: 9px 10px;
  background: transparent;
  color: rgba(255,255,255,.88);
  font-weight: 600;
}

.item:hover { background: rgba(88,138,213,.18); }

.item small {
  display: block;
  margin-top: 2px;
  color: rgba(255,255,255,.42);
  font-size: 10px;
  font-weight: 500;
}

.no-results {
  display: none;
  padding: 22px 12px;
  color: rgba(255,255,255,.48);
  text-align: center;
  font-size: 13px;
}

.detail {
  display: none;
  padding: 15px 16px 18px;
  overflow: auto;
}

.detail.active { display: block; }
.list-view.hidden { display: none; }

.back {
  margin-bottom: 13px;
  padding: 7px 10px;
  background: rgba(255,255,255,.055);
}

.detail-kicker {
  color: #8fbaff;
  text-transform: uppercase;
  letter-spacing: .12em;
  font-size: 11px;
  font-weight: 800;
  margin-bottom: 5px;
}

.detail h2 {
  margin: 0 0 13px;
  font-size: 25px;
}

.info-row {
  display: grid;
  grid-template-columns: 92px 1fr;
  gap: 10px;
  padding: 7px 0;
  border-top: 1px solid rgba(255,255,255,.08);
  font-size: 13px;
}

.label { color: rgba(255,255,255,.50); }

.info-section {
  border-top: 1px solid rgba(255,255,255,.08);
  margin-top: 7px;
  padding-top: 12px;
}

.info-section h3 {
  margin: 0 0 6px;
  color: rgba(255,255,255,.50);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: .09em;
}

.info-section p {
  margin: 0;
  line-height: 1.55;
  font-size: 14px;
  color: rgba(255,255,255,.90);
}

#error {
  display: none;
  position: fixed;
  left: 18px;
  right: 18px;
  bottom: 18px;
  z-index: 50;
  background: #4b1515;
  border: 1px solid #a84b4b;
  padding: 12px 14px;
  border-radius: 12px;
}

@media(max-width:800px) {
  .brand { left:12px; top:12px; }
  .top-right { right:12px; top:82px; max-width:calc(100vw - 24px); }
  .atlas-toggle { left:12px; top:82px; }
  .atlas { left:8px; right:8px; width:auto; top:132px; bottom:8px; }
  button { padding:8px 10px; font-size:12px; }
  .hint { bottom:12px; font-size:11px; }
  .coords { display:none; }
}
</style>

<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
  }
}
</script>
</head>

<body>
<div id="app"></div>

<div class="hud">
  <div class="brand">
    <h1>ALTEA</h1>
    <p>interaktywny globus świata</p>
  </div>

  <button id="atlasToggle" class="atlas-toggle">☰ Atlas Altei</button>

  <div class="top-right">
    <div class="controls">
      <button id="spinBtn">⏸ Zatrzymaj obrót</button>
      <button id="resetBtn">↺ Ustaw widok</button>
      <button id="fullBtn">⛶ Pełny ekran</button>
    </div>

    <div class="layers">
      <button class="layer-btn active" data-layer="miasta">Miasta</button>
      <button class="layer-btn" data-layer="stany">Stany i Wyspy</button>
      <button class="layer-btn" data-layer="dystrykty">Dystrykty</button>
      <button class="layer-btn" data-layer="kontynenty">Kontynenty</button>
    </div>
  </div>

  <div id="hint" class="hint">Przeciągnij, aby obracać • kółko / szczypanie = zoom</div>
  <div id="coords" class="coords"></div>
</div>

<aside id="atlas" class="atlas">
  <div class="atlas-head">
    <div>
      <div class="atlas-title">Atlas Altei</div>
      <div class="atlas-sub">Wyszukiwarka i kompendium lokacji</div>
    </div>
    <button id="atlasClose" class="atlas-close">✕</button>
  </div>

  <div id="listView" class="list-view">
    <div class="search-wrap">
      <input id="search" class="search" type="search" autocomplete="off"
             placeholder="Szukaj kontynentu, dystryktu, stanu..." />
    </div>
    <div id="atlasBody" class="atlas-body"></div>
  </div>

  <div id="detail" class="detail"></div>
</aside>

<div id="error"></div>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const DATA = {"continents": {"Kentria": {"type": "Kontynent", "opis": "Największy kontynent Altei. Ojczyzna Ludzi, Oni, Genasi, Elfów, Orków, Niziołków oraz niektórych klanów Goliathów i Skavran. Szeroki wachlarz klimatów, od gorących równin na południowym-zachodzie, przez klimat umiarkowany na północnym-zachodzie, zimne tundry na wschodnim wybrzeżu, po jałowe pustkowia na południu.", "stolica": "Stolica Altei Airoudan (zniszczona)", "wladca": "Lady Odiane z Pyrghos, Elfka", "info": "Obecnie większość kontynentu znajduje się pod władzą Karaisańską, trwa wojna."}, "Tifia": {"type": "Kontynent", "opis": "Jej mieszkańcy cenią kontakt z naturą. Ojczyzna Satyrów, Airi, Khajiit'ów i leśnych elfów. Klimat ciepły, tropikalny.", "stolica": "brak", "wladca": "Lord Igetis z Cherson, Skavran", "info": "brak"}, "Macrichor": {"type": "Kontynent", "opis": "Duża część tego kontynentu jest silnie skupiona na religii. Ojczyzna Loxodonów, niektórych klanów Goliathów i Orków oraz ludzkiej kolonii. Kontynent w dużej mierze pokryty mroźną tundrą.", "stolica": "brak", "wladca": "Lord Varys z Ekklis, Loxodon", "info": "Dom dla wielu typów istot nadprzyrodzonych (Wampirze Dwory, Stada Wilkołaków itd.)."}, "Ammodes": {"type": "Kontynent", "opis": "Pustynny kontynent. Ojczyzna Sauriali i Sarrukhów oraz niektórych klanów Khajiit'ów. Przez 3 tysiące lat stanowił dom dla Drakonów. Bardzo ciepły klimat.", "stolica": "brak", "wladca": "Lord Erpon z Kelyf, Saurial", "info": "Po Karaisańskiej inwazji spora część kontynentu została unicestwiona przez wybuch. Większość populacji Ammodesu zdążyła się ewakuować na inne kontynenty. Drakoni wyruszyli w podróż powrotną do swojej ojczyzny, na Drakorię."}, "Edafos": {"type": "Kontynent", "opis": "Lodowy kontynent, położony na pasie lodowców okrążających świat. Ojczyzna niektórych klanów Orków i Skavran oraz ludzkiej kolonii.", "stolica": "brak", "wladca": "Lady Sakkali z Thropos, Człowiek", "info": "brak"}, "Drakoria": {"type": "Kontynent", "opis": "Tajemniczy kontynent, niepodległy rządom Alteańczyków. Dom dla smoków i innych legendarnych istot.", "stolica": "brak", "wladca": "Vran, Król Smoków, Wielki Smok Burzy", "info": "Dawniej ojczyzna Drakonów, zniszczona przez wojnę z Wielkim Smokiem Chaosu. Po 3 tysiącach lat Drakoni powracają, by odbudować swoje królestwo."}}, "districts": {"Karaisan": {"type": "Dystrykt", "kontynent": "Kentria", "opis": "Północny dystrykt Kentrii. Ojczyzna Ergy, Cherbaty i Oni. Granice dystryktu wyznaczone są na bazie granicy dawnego Imperium Karaisańskiego. Swojego Barona nadal nazywają imperatorem.", "stolica": "Thoras", "info": "Kultura Karaisańska wzorowana jest na kulturze Japońskiej, Chińskiej i Koreańskiej. Karaisan jest rejonem skupionym na sile."}, "Kephal": {"type": "Dystrykt", "kontynent": "Kentria", "opis": "Największy Dystrykt, zamieszkały przez szeroki wachlarz ras. Znajdowała się tu stolica Altei, co przyczyniało się do znacznej imigracji Alteańczyków z różnych stron świata. Dawniej większość Kephalu znajdowała się pod władzą Genasi, pierwszej inteligentnej rasy Altei. Dziś jest ojczyzną Genasi, Elfów i niektórych klanów Skavran.", "stolica": "Airoudan (zniszczone)", "info": "Kephal znajduje się obecnie pod władzą Karaisanu."}, "Levra": {"type": "Dystrykt", "kontynent": "Kentria", "opis": "Wschodni dystrykt Kentrii. Ojczyzna Ludzi, Krasnoludów i Niziołków. Obszar głównie poświęcony rolnictwu, połowowi ryb i górnictwu.", "stolica": "brak", "info": "brak"}, "Notos": {"type": "Dystrykt", "kontynent": "Kentria", "opis": "Południowy dystrykt Kentrii. Surowe, jałowe pustkowia i skalne wzgórza. Ojczyzna Orków i niektórych klanów Goliathów.", "stolica": "brak", "info": "brak"}, "Mesan": {"type": "Dystrykt", "kontynent": "Tifia", "opis": "Północny dystrykt Tifii. Ojczyzna Airi i leśnych Elfów.", "stolica": "brak", "info": "brak"}, "Agrios": {"type": "Dystrykt", "kontynent": "Tifia", "opis": "Południowy dystrykt Tifii. Ojczyzna Skavran, Satyrów i Khajiit'ów.", "stolica": "brak", "info": "brak"}, "Stratos": {"type": "Dystrykt", "kontynent": "Macrichor", "opis": "Północny dystrykt Macrichor'u. Ojczyzna Loxodonów. Bardzo religijny region.", "stolica": "Ekklis", "info": "brak"}, "Genikos": {"type": "Dystrykt", "kontynent": "Macrichor", "opis": "Zachodni dystrykt Macrichor'u. Ojczyzna niektórych klanów Orków. Bardzo wojskowy region.", "stolica": "Frour", "info": "brak"}, "Sakhan": {"type": "Dystrykt", "kontynent": "Macrichor", "opis": "Wschodni dystrykt Macrichor'u. Ojczyzna niektórych klanów Goliathów i ludzkiej kolonii.", "stolica": "brak", "info": "To tutejsze klany Goliathów zapoczątkowały swoją własną kulturę, podobną do kultury staronordyckiej. Tę samą kulturę zaadaptowała następnie znajdująca się tam ludzka kolonia."}, "Kafti": {"type": "Dystrykt", "kontynent": "Ammodes", "opis": "Zachodni dystrykt Ammodesu. Ojczyzna Sauriali i Sarrukhów. Rejon silnie poświęcony technologii i magii.", "stolica": "brak", "info": "Opuszczony w związku z tragedią na Ammodesie."}, "Nerou": {"type": "Dystrykt", "kontynent": "Ammodes", "opis": "Wschodni dystrykt Ammodesu. Ojczyzna niektórych klanów Khajiit'ów i dom dla Drakonów.", "stolica": "brak", "info": "Połowa tego dystryktu została unicestwiona w wyniku eksplozji kataklizmu."}, "Pagos": {"type": "Dystrykt", "kontynent": "Edafos", "opis": "Północny dystrykt Edafos. Ojczyzna dla niektórych klanów Skavran i ludzkiej kolonii.", "stolica": "brak", "info": "Obecnie znajdują się tam uciekinierzy z Kentrii i Ammodesu, w tym Lady Odiane."}, "Anemos": {"type": "Dystrykt", "kontynent": "Edafos", "opis": "Południowy dystrykt Edafos. Ojczyzna niektórych klanów Orków.", "stolica": "Vasi", "info": "brak"}}, "states": {"Lofos": {"type": "Stan", "dystrykt": "Kephal", "kontynent": "Kentria", "opis": "Stan handlowy/portowy."}, "Dasos": {"type": "Stan", "dystrykt": "Kephal", "kontynent": "Kentria", "opis": "Stan skupiony na badaniu Magii. Magiczne lasy i Wielkie Drzewo Życia."}, "Vathra": {"type": "Stan", "dystrykt": "Kephal", "kontynent": "Kentria", "opis": "Stan centralny, tu znajdowało się Airoudan."}, "Livadia": {"type": "Stan", "dystrykt": "Kephal", "kontynent": "Kentria", "opis": "Siedziba Elfów."}, "Zounos": {"type": "Stan", "dystrykt": "Kephal", "kontynent": "Kentria", "opis": "Ojczyzna Genasi."}, "Sousi": {"type": "Stan", "dystrykt": "Karaisan", "kontynent": "Kentria", "opis": "Stan poświęcony sztuce. Odłam kultury wzorowany bardziej na kulturze Koreańskiej."}, "Nouka": {"type": "Stan", "dystrykt": "Karaisan", "kontynent": "Kentria", "opis": "Stan specjalizujący się w wyrobie broni i pancerzy."}, "Shoji": {"type": "Stan", "dystrykt": "Karaisan", "kontynent": "Kentria", "opis": "Stan handlowy."}, "Nihon": {"type": "Stan", "dystrykt": "Karaisan", "kontynent": "Kentria", "opis": "Główny stan Karaisanu, tu znajduje się dawna stolica Imperium — Thoras."}, "Vizon": {"type": "Stan", "dystrykt": "Levra", "kontynent": "Kentria", "opis": "Dawniej królestwo Niziołków. Stan rolniczy. Kultura wzorowana na francuskiej."}, "Polis": {"type": "Stan", "dystrykt": "Levra", "kontynent": "Kentria", "opis": "Dawniej królestwo ludzi. Stan połowowy, portowy, specjalizujący się w łodziach. Kultura wzorowana na brytyjskiej."}, "Duria": {"type": "Stan", "dystrykt": "Levra", "kontynent": "Kentria", "opis": "Dawniej królestwo Krasnoludów. Stan górniczy. Kultura wzorowana na niemieckiej."}, "Matom": {"type": "Stan", "dystrykt": "Notos", "kontynent": "Kentria", "opis": "Północne pustkowia, ojczyzna Orków."}, "Krizon": {"type": "Stan", "dystrykt": "Notos", "kontynent": "Kentria", "opis": "Południowe pustkowia, ojczyzna Orków."}, "Exoris": {"type": "Stan", "dystrykt": "Notos", "kontynent": "Kentria", "opis": "Skalne wzgórza, ojczyzna Goliathów."}, "Pigon": {"type": "Wyspa", "dystrykt": "Wyspa", "kontynent": "Kentria", "opis": "Wolna wyspa, zamieszkała przez kolonię Karaisańskich uciekinierów."}, "Tsanta": {"type": "Wyspa", "dystrykt": "Wyspa", "kontynent": "Kentria", "opis": "Wyspa u ujścia Morza Ryghana. Oficjalnie , "Aktin": {"type": "Stan", "dystrykt": "Nerou", "kontynent": "Ammodes", "opis": "Dom dla dużej społeczności pustynnych Khajiit'ów. Niemal całkowicie unicestwiony przez Karaisan."}, "Fotia": {"type": "Stan", "dystrykt": "Kafti", "kontynent": "Ammodes", "opis": "Ojczyzna Sauriali i światowa stolica technologii."}, "Moti": {"type": "Stan", "dystrykt": "Kafti", "kontynent": "Ammodes", "opis": "Ojczyzna Sarrukhów, znana z niewolnictwa w przeszłości."}, "Erpon": {"type": "Wyspa", "dystrykt": "Wyspa", "kontynent": "Ammodes", "opis": "Oficjalnie niezamieszkała."}, "Chion": {"type": "Stan", "dystrykt": "Pagos", "kontynent": "Edafos", "opis": "Ojczyzna niektórych klanów Skavran."}, "Thyel": {"type": "Stan", "dystrykt": "Pagos", "kontynent": "Edafos", "opis": "Dom ludzkiej kolonii."}, "Tern": {"type": "Stan", "dystrykt": "Anemos", "kontynent": "Edafos", "opis": "Ojczyzna niektórych klanów Orków."}, "Monos": {"type": "Stan", "dystrykt": "Anemos", "kontynent": "Edafos", "opis": "Ojczyzna niektórych klanów Orków."}, "Akro": {"type": "Wyspa", "dystrykt": "Wyspa", "kontynent": "Edafos", "opis": "Oficjalnie niezamieszkała."}}};

const MAPS = {
  miasta: './altea_miasta.png',
  stany: './altea_stany_wyspy.png',
  dystrykty: './altea_dystrykty.png',
  kontynenty: './altea_kontynenty.png'
};

const GROUPS = [
  { key:'continents', label:'Kontynenty' },
  { key:'districts', label:'Dystrykty' },
  { key:'states', label:'Stany i Wyspy' }
];

const container = document.getElementById('app');
const renderer = new THREE.WebGLRenderer({
  antialias:true,
  alpha:false,
  powerPreference:'high-performance'
});

renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
container.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x050812);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, .05, 100);
camera.position.set(0, .08, 3.15);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = .055;
controls.enablePan = false;
controls.minDistance = 1.45;
controls.maxDistance = 6;
controls.rotateSpeed = .58;
controls.zoomSpeed = .8;

const DEFAULT_ROT_Y = Math.PI * 1.94;
const DEFAULT_ROT_X = -.04;

const world = new THREE.Group();
world.rotation.set(DEFAULT_ROT_X, DEFAULT_ROT_Y, 0);
scene.add(world);

const loader = new THREE.TextureLoader();
const textureCache = new Map();

function configureTexture(t) {
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = renderer.capabilities.getMaxAnisotropy();
  t.minFilter = THREE.LinearMipmapLinearFilter;
  t.magFilter = THREE.LinearFilter;
  t.generateMipmaps = true;
  return t;
}

async function getTexture(path) {
  if (textureCache.has(path)) return textureCache.get(path);
  const t = configureTexture(await loader.loadAsync(path));
  textureCache.set(path, t);
  return t;
}

const material = new THREE.MeshStandardMaterial({
  map: await getTexture(MAPS.miasta),
  roughness:.9,
  metalness:0
});

const globe = new THREE.Mesh(
  new THREE.SphereGeometry(1, 256, 160),
  material
);
world.add(globe);

const atmosphere = new THREE.Mesh(
  new THREE.SphereGeometry(1.018, 128, 96),
  new THREE.MeshBasicMaterial({
    color:0x8fdcff,
    transparent:true,
    opacity:.075,
    side:THREE.BackSide,
    blending:THREE.AdditiveBlending,
    depthWrite:false
  })
);
world.add(atmosphere);

// Gwiazdy
const starGeo = new THREE.BufferGeometry();
const stars = [];

for (let i=0; i<1800; i++) {
  const r = 15 + Math.random()*35;
  const u = Math.random();
  const v = Math.random();
  const theta = 2*Math.PI*u;
  const phi = Math.acos(2*v-1);

  stars.push(
    r*Math.sin(phi)*Math.cos(theta),
    r*Math.cos(phi),
    r*Math.sin(phi)*Math.sin(theta)
  );
}

starGeo.setAttribute('position', new THREE.Float32BufferAttribute(stars,3));

scene.add(new THREE.Points(
  starGeo,
  new THREE.PointsMaterial({
    color:0xffffff,
    size:.035,
    sizeAttenuation:true,
    transparent:true,
    opacity:.78
  })
));

// Oświetlenie
scene.add(new THREE.AmbientLight(0xffffff,.72));
scene.add(new THREE.HemisphereLight(0xcfe5ff,0x26324a,1.1));

const keyLight = new THREE.DirectionalLight(0xffffff,1.55);
keyLight.target.position.set(0,0,0);
scene.add(keyLight, keyLight.target);

const rim = new THREE.DirectionalLight(0x75aaff,.28);
rim.position.set(-4,2,-4);
scene.add(rim);

// Podstawowe przyciski
let activeLayer='miasta';
let autoSpin=true;
let interacting=false;

controls.addEventListener('start',()=>interacting=true);
controls.addEventListener('end',()=>interacting=false);

const spinBtn=document.getElementById('spinBtn');
spinBtn.onclick=()=>{
  autoSpin=!autoSpin;
  spinBtn.textContent=autoSpin?'⏸ Zatrzymaj obrót':'▶ Włącz obrót';
};

document.getElementById('resetBtn').onclick=()=>{
  camera.position.set(0,.08,3.15);
  controls.target.set(0,0,0);
  world.rotation.set(DEFAULT_ROT_X,DEFAULT_ROT_Y,0);
  controls.update();
};

document.getElementById('fullBtn').onclick=async()=>{
  try {
    if (!document.fullscreenElement) await document.documentElement.requestFullscreen();
    else await document.exitFullscreen();
  } catch(e) {}
};

document.querySelectorAll('.layer-btn').forEach(btn=>{
  btn.addEventListener('click', async ()=>{
    const layer=btn.dataset.layer;
    if (!layer || layer===activeLayer) return;

    try {
      material.map=await getTexture(MAPS[layer]);
      material.needsUpdate=true;
      activeLayer=layer;

      document.querySelectorAll('.layer-btn').forEach(x=>{
        x.classList.toggle('active',x===btn);
      });

      document.getElementById('error').style.display='none';
    } catch(e) {
      const er=document.getElementById('error');
      er.style.display='block';
      er.textContent=`Nie udało się wczytać mapy: ${MAPS[layer]}`;
    }
  });
});

setTimeout(()=>{
  Object.values(MAPS).forEach(p=>getTexture(p).catch(()=>{}));
},800);

// Atlas po lewej
const atlas=document.getElementById('atlas');
const atlasToggle=document.getElementById('atlasToggle');
const atlasClose=document.getElementById('atlasClose');
const atlasBody=document.getElementById('atlasBody');
const search=document.getElementById('search');
const listView=document.getElementById('listView');
const detail=document.getElementById('detail');

atlasToggle.onclick=()=>{
  atlas.classList.toggle('open');
  if (atlas.classList.contains('open')) setTimeout(()=>search.focus(),120);
};

atlasClose.onclick=()=>atlas.classList.remove('open');

function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g,m=>({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
  }[m]));
}

function row(label,value) {
  if (!value || value==='brak') return '';
  return `<div class="info-row"><div class="label">${esc(label)}</div><div>${esc(value)}</div></div>`;
}

function section(label,value) {
  if (!value || value==='brak') return '';
  return `<div class="info-section"><h3>${esc(label)}</h3><p>${esc(value)}</p></div>`;
}

function normalize(s) {
  return String(s ?? '')
    .toLocaleLowerCase('pl')
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g,'');
}

function metaFor(key,d) {
  if (key==='districts') return d.kontynent || '';
  if (key==='states') {
    if (d.dystrykt==='Wyspa') return `${d.type} • ${d.kontynent}`;
    return `${d.dystrykt} • ${d.kontynent}`;
  }
  return '';
}

function searchableText(key,name,d) {
  return normalize([
    name,d.type,d.opis,d.stolica,d.wladca,d.info,
    d.kontynent,d.dystrykt
  ].filter(Boolean).join(' '));
}

function renderList(filter='') {
  const q=normalize(filter.trim());
  let found=0;
  let html='';

  for (const group of GROUPS) {
    const entries=Object.entries(DATA[group.key])
      .filter(([name,d])=>!q || searchableText(group.key,name,d).includes(q))
      .sort(([a],[b])=>a.localeCompare(b,'pl'));

    if (!entries.length) continue;
    found += entries.length;

    const open=q ? ' open' : '';
    html+=`
      <section class="group${open}" data-group="${group.key}">
        <button class="group-head">
          <span class="group-meta">
            <span>${esc(group.label)}</span>
            <span class="count">${entries.length}</span>
          </span>
          <span class="chevron">›</span>
        </button>
        <div class="group-items">
          ${entries.map(([name,d])=>`
            <button class="item" data-key="${group.key}" data-name="${esc(name)}">
              ${esc(name)}
              ${metaFor(group.key,d) ? `<small>${esc(metaFor(group.key,d))}</small>` : ''}
            </button>
          `).join('')}
        </div>
      </section>
    `;
  }

  html+=`<div class="no-results" style="display:${found?'none':'block'}">Brak wyników.</div>`;
  atlasBody.innerHTML=html;

  atlasBody.querySelectorAll('.group-head').forEach(btn=>{
    btn.onclick=()=>btn.closest('.group').classList.toggle('open');
  });

  atlasBody.querySelectorAll('.item').forEach(btn=>{
    btn.onclick=()=>showDetail(btn.dataset.key,btn.dataset.name);
  });
}

function showDetail(key,name) {
  const d=DATA[key]?.[name];
  if (!d) return;

  let html=`<button id="backToList" class="back">← Wróć do listy</button>`;
  html+=`<div class="detail-kicker">${esc(d.type)}</div><h2>${esc(name)}</h2>`;

  if (key==='continents') {
    html+=row('Stolica',d.stolica);
    html+=row('Władca',d.wladca);
    html+=section('Opis',d.opis);
    html+=section('Dodatkowe informacje',d.info);
  } else if (key==='districts') {
    html+=row('Kontynent',d.kontynent);
    html+=row('Stolica',d.stolica);
    html+=section('Opis',d.opis);
    html+=section('Dodatkowe informacje',d.info);
  } else {
    html+=row('Kontynent',d.kontynent);
    if (d.dystrykt==='Wyspa') html+=row('Status','Niezależna wyspa');
    else html+=row('Dystrykt',d.dystrykt);
    html+=section('Opis',d.opis);
  }

  detail.innerHTML=html;
  listView.classList.add('hidden');
  detail.classList.add('active');

  document.getElementById('backToList').onclick=showList;
}

function showList() {
  detail.classList.remove('active');
  listView.classList.remove('hidden');
  setTimeout(()=>search.focus(),30);
}

search.addEventListener('input',()=>{
  renderList(search.value);
  showList();
});

renderList('');

// Shift+klik zostaje jako techniczne współrzędne do przyszłych funkcji.
const raycaster=new THREE.Raycaster();
const pointer=new THREE.Vector2();
const coordsEl=document.getElementById('coords');

renderer.domElement.addEventListener('click',ev=>{
  if (!ev.shiftKey) return;

  const r=renderer.domElement.getBoundingClientRect();
  pointer.x=((ev.clientX-r.left)/r.width)*2-1;
  pointer.y=-((ev.clientY-r.top)/r.height)*2+1;

  raycaster.setFromCamera(pointer,camera);
  const hit=raycaster.intersectObject(globe,false)[0];
  if (!hit?.uv) return;

  const lon=(hit.uv.x*360-180).toFixed(2);
  const lat=(hit.uv.y*180-90).toFixed(2);

  coordsEl.textContent=`Mapa: lon ${lon}°, lat ${lat}°`;
  coordsEl.classList.add('show');

  clearTimeout(coordsEl._t);
  coordsEl._t=setTimeout(()=>coordsEl.classList.remove('show'),4500);
});

const hint=document.getElementById('hint');
setTimeout(()=>hint.style.opacity='.25',7000);

const clock=new THREE.Clock();

function animate() {
  requestAnimationFrame(animate);

  const dt=Math.min(clock.getDelta(),.05);
  if (autoSpin && !interacting) world.rotation.y+=dt*.055;

  keyLight.position.copy(camera.position);

  controls.update();
  renderer.render(scene,camera);
}

animate();

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
});
</script>
</body>
</html>
